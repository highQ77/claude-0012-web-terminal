          ]));
        }
        const fcp = performance.getEntriesByName('first-contentful-paint')[0];
        const lcp = await new Promise(res => {
          try {
            let last = null;
            const po = new PerformanceObserver(l => { last = l.getEntries().at(-1); });
            po.observe({ type: 'largest-contentful-paint', buffered: true });
            setTimeout(() => { po.disconnect(); res(last); }, 50);
          } catch { res(null); }
        });
        const res = performance.getEntriesByType('resource');
        print('<span class="k">▸ 繪製與資源</span>');
        print(kv([
          ['FCP（首次內容繪製）', fcp ? ms(fcp.startTime) : '-'],
          ['LCP（最大內容繪製）', lcp ? ms(lcp.startTime) : '-'],
          ['載入資源', `${res.length} 個，${fmtBytes(res.reduce((a, r) => a + (r.transferSize || 0), 0))}`],
          ['DOM 節點數', String(document.getElementsByTagName('*').length)],
          ['頁面已開啟', `${(performance.now() / 1000).toFixed(1)} 秒`],
        ]));
        const m = performance.memory;
        if (m) {
          print('<span class="k">▸ JS 記憶體</span> <span class="dim">(Chromium)</span>');
          print(kv([
            ['已使用', fmtBytes(m.usedJSHeapSize)],
            ['已配置', fmtBytes(m.totalJSHeapSize)],
            ['上限', fmtBytes(m.jsHeapSizeLimit)],
          ]));
        }
        // 量測 1 秒內的畫面更新次數
        const fps = await new Promise(resolve => {
          let frames = 0; const start = performance.now();
          const tick = t => { frames++; if (t - start < 1000) requestAnimationFrame(tick); else resolve(frames * 1000 / (t - start)); };
          requestAnimationFrame(tick);
          setTimeout(() => resolve(null), 2500);
        });
        print(kv([['目前 FPS', fps ? `${Math.round(fps)}` : '無法量測（分頁不在前景）']]));
      }

  /* ---------- 輸入列 ---------- */
  const promptRow = document.createElement('div');
  promptRow.className = 'row';
  promptRow.innerHTML = '<span class="p">user%</span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="指令輸入">';
  out.appendChild(promptRow);
  const input = $('#in');
  // 歷史紀錄：存在 localStorage，最多 100 筆
  const HISTORY_KEY = 'term.history', HISTORY_MAX = 100;
  const history = (() => {
    try {
      const arr = JSON.parse(store.get(HISTORY_KEY) || '[]');
      return Array.isArray(arr) ? arr.filter(x => typeof x === 'string').slice(-HISTORY_MAX) : [];
    } catch { return []; }
  })();
  let hIdx = history.length;
  function saveHistory() {
    if (history.length > HISTORY_MAX) history.splice(0, history.length - HISTORY_MAX);
    store.set(HISTORY_KEY, JSON.stringify(history));
  }

  let lastOutput = [];
  // 指令依序執行：前一個（非同步）指令完成後才開始下一個，避免輸出交錯
  let queue = Promise.resolve();
  function exec(raw) {
    queue = queue.then(() => execNow(raw));
    return queue;
  }
  async function execNow(raw) {
    print(`<span class="p">user%</span> ${esc(raw)}`);
    const [cmd, ...args] = raw.trim().split(/\s+/);
    if (!cmd) return;
    const entry = raw.trim();
    if (history[history.length - 1] !== entry) { history.push(entry); saveHistory(); } // 連續相同指令只記一次
    hIdx = history.length;
    const c = COMMANDS[cmd.toLowerCase()];
    if (!c) { print(`command not found: ${esc(cmd)}  <span class="dim">(輸入 help 查看指令)</span>`, 'bad'); return; }
    const name = cmd.toLowerCase();
    if (name !== 'copy') capture = [];
    try { await c.run(args.join(' ')); } catch (err) { print('錯誤：' + esc(err.message), 'bad'); }
    if (name !== 'copy') { lastOutput = capture; capture = null; }
  }

  // 左側卡片：點擊直接執行指令
  document.querySelectorAll('[data-cmd]').forEach(card =>
    card.addEventListener('click', async () => {
      await exec(card.dataset.cmd);
      if (card.dataset.cmd !== 'calc' && !TOOLS[card.dataset.cmd]) input.focus(); // 工具開啟後保留焦點在工具上
    }));

  input.addEventListener('keydown', async e => {
    if (e.key === 'Enter') {
      const raw = input.value; input.value = '';
      await exec(raw);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault(); if (hIdx > 0) input.value = history[--hIdx];
    } else if (e.key === 'ArrowDown') {
      e.preventDefault(); hIdx = Math.min(history.length, hIdx + 1); input.value = history[hIdx] || '';
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const m = Object.keys(COMMANDS).filter(k => k.startsWith(input.value.trim().toLowerCase()));
      if (m.length === 1) input.value = m[0] + ' ';
      else if (m.length > 1) print(m.join('  '), 'dim');
    } else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault(); COMMANDS.clear.run();
    }
  });
  out.addEventListener('click', e => {
    const b = e.target.closest('.api');
    if (b) showDoc(b.dataset.api);
    if (!getSelection().toString()) input.focus();
  });

  /* ---------- API 說明 ---------- */
  // 簡易語法高亮（JS + HTML）
  const HL_RE = new RegExp([
    /(<!--[\s\S]*?-->|\/\*[\s\S]*?\*\/|\/\/[^\n]*)/.source,                                     // 1 註解
    /('(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*"|`(?:\\[\s\S]|[^`\\])*`)/.source,                  // 2 字串
    /(<\/?[a-zA-Z][\w-]*|(?<![=\s-])\/?>)/.source,                                              // 3 HTML 標籤
    /\b(const|let|var|function|return|if|else|await|async|new|class|extends|static|super|this|for|while|do|of|in|throw|try|catch|finally|typeof|instanceof|break|continue|import|export|from|default|true|false|null|undefined|void|delete|switch|case)\b/.source, // 4 關鍵字
    /(\b0x[\da-fA-F]+\b|\b\d[\d_]*(?:\.\d+)?(?:e[+-]?\d+)?\b|(?<![\w.])\.\d+\b)/.source,          // 5 數字
    /([\w-]+(?==["']))/.source,                                                                 // 6 HTML 屬性
    /([A-Za-z_$][\w$]*(?=\s*\())/.source,                                                       // 7 函式呼叫
    /(\b[A-Z][\w$]*\b)/.source,                                                                 // 8 類別 / 全域物件
    /((?<=\.)[A-Za-z_$][\w$]*)/.source,                                                         // 9 屬性
  ].join('|'), 'g');
  const HL_CLS = ['com', 'str', 'tag', 'kw', 'num', 'attr', 'fn', 'cls', 'prop'];
  function highlight(code) {
    let html = '', last = 0;
    for (const m of code.matchAll(HL_RE)) {
      const i = m.slice(1).findIndex(g => g !== undefined);
      html += esc(code.slice(last, m.index)) + `<span class="t-${HL_CLS[i]}">${esc(m[0])}</span>`;
      last = m.index + m[0].length;
    }
    return html + esc(code.slice(last));
  }

  // 左側回到 Web Terminal 主頁
  // 左側只會顯示一個畫面：intro（主頁）、doc（API 說明）、calc（小算盤）
  function showView(id) {
    for (const v of ['intro', 'doc', 'calc']) $('#' + v).hidden = v !== id;
    document.querySelectorAll('.tool-view').forEach(t => { t.hidden = t.dataset.tool !== id; });
    if (id !== 'doc') $('#doc').innerHTML = '';
    document.querySelector('main').scrollTop = 0;
  }
  const currentView = () => ['intro', 'doc', 'calc'].find(v => !$('#' + v).hidden)
    || document.querySelector('.tool-view:not([hidden])')?.dataset.tool;

  function showHome() {
    showView('intro');
    out.querySelectorAll('.api.active').forEach(b => b.classList.remove('active'));
    document.querySelector('main').scrollTop = 0;
  }

  function showDoc(name) {
    const d = API_DOCS[name], st = apiStatus[name];
    if (!d) return;
    out.querySelectorAll('.api').forEach(b => b.classList.toggle('active', b.dataset.api === name));
    const url = 'https://developer.mozilla.org/docs/Web/' + d.mdn;
    const list = arr => `<ul class="bullets">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    $('#doc').innerHTML = `
      <header class="doc-head">
        <div>
          <h2>${esc(name)}</h2>
          <div class="doc-meta">
            ${st ? `<span class="tag">${esc(st.group)}</span>` : ''}
            ${st ? `<span class="tag ${st.ok ? 'yes' : 'no'}">${st.ok ? '✓ 此瀏覽器支援' : '✗ 此瀏覽器不支援'}</span>` : ''}
          </div>
        </div>
        <button class="doc-close" id="docClose" aria-label="關閉說明">✕ 關閉</button>
      </header>
      <h3>說明</h3><p class="desc">${esc(d.desc)}</p>
      ${d.members ? `<h3>主要方法與屬性</h3><dl class="members">${d.members.map(([k, v]) =>
        `<div><dt><code>${esc(k)}</code></dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
      ${d.use ? `<h3>使用情境</h3>${list(d.use)}` : ''}
      ${d.notes ? `<h3>注意事項</h3><div class="notes">${d.notes.map(n => `<div>${esc(n)}</div>`).join('')}</div>` : ''}
      <h3>範例</h3>
      <div class="code">
        <div class="code-bar"><span class="lang">${/^\s*</.test(d.ex) ? 'HTML' : 'JavaScript'}</span><button class="copy" id="docCopy">複製</button></div>
        <pre><code>${highlight(d.ex)}</code></pre>
      </div>
      <h3>參考文件</h3><a class="mdn" href="${url}" target="_blank" rel="noopener">MDN Web Docs：${esc(name)} ↗</a>`;
    showView('doc');
    $('#docClose').onclick = () => { showHome(); input.focus(); };
    $('#docCopy').onclick = async e => {
      const btn = e.currentTarget;
      try { await navigator.clipboard.writeText(d.ex); btn.textContent = '已複製'; }
      catch { btn.textContent = '複製失敗'; }
      setTimeout(() => { btn.textContent = '複製'; }, 1500);
    };
    document.querySelector('main').scrollTop = 0;
  }

  /* ---------- 卡片與面板的滑鼠聚光效果 ---------- */
  if (matchMedia('(pointer: fine)').matches) {
    const SPOT = '.card, .panel, .calc, .calc-history, .pill, .mdn';
    let last = null;
    document.querySelector('main').addEventListener('pointermove', e => {
      const t = e.target.closest(SPOT);
      if (last && last !== t) { last.style.removeProperty('--mx'); last.style.removeProperty('--my'); }
      last = t;
      if (!t) return;
      const r = t.getBoundingClientRect();
      t.style.setProperty('--mx', `${e.clientX - r.left}px`);
      t.style.setProperty('--my', `${e.clientY - r.top}px`);
    }, { passive: true });
    document.querySelector('main').addEventListener('pointerleave', () => {
      if (last) { last.style.removeProperty('--mx'); last.style.removeProperty('--my'); last = null; }
    });
  }

  /* ---------- 初始化 ---------- */
  applyTheme(store.get('term.theme') || 'green');
  if (store.get('term.cursor') !== 'off') FxCursor.enable();
  print('Web Terminal — 輸入 <span class="k">help</span> 查看可用指令', 'dim');
  input.focus();
})();
</script>
</body>
</html>
